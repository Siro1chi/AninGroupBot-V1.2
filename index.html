<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление комнатами</title>
    <!-- Официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        /* Современные CSS переменные, намертво связанные с темой Telegram */
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f6);
        }
        
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            -webkit-user-select: none; user-select: none;
        }

        h2 { 
            font-size: 22px; 
            font-weight: 700;
            margin-bottom: 20px; 
            text-align: center; 
        }

        .rooms-container { 
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }

        .room-card {
            background-color: var(--sec-bg);
            border-radius: 14px; 
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        .room-title { 
            font-weight: 700; 
            font-size: 18px; 
            margin-bottom: 4px;
            max-width: 75%; 
        }

        .room-meta { 
            font-size: 12px; 
            color: var(--hint-color); 
        }

        .badge {
            position: absolute; 
            top: 16px; 
            right: 16px;
            background-color: var(--link-color); 
            color: var(--button-text);
            padding: 4px 8px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold;
        }

        .btn {
            background-color: var(--button-color); 
            color: var(--button-text);
            border: none; 
            border-radius: 10px; 
            padding: 12px; 
            margin-top: 14px;
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .btn:active { 
            opacity: 0.85; 
        }

        .empty-state { 
            text-align: center; 
            color: var(--hint-color); 
            margin-top: 60px; 
            font-size: 15px;
        }
    </style>
</head>
<body>

    <h2>🎭 Игровые комнаты</h2>
    <div id="rooms-list" class="rooms-container">
        <div class="empty-state">Синхронизация с сервером...</div>
    </div>

        <script>
        // Объявляем глобальную переменную для Telegram WebApp
        let tg = null;

        // Главная функция отрисовки приложения
        async function renderApp() {
            // Безопасно инициализируем Telegram API, когда всё точно загрузилось
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            } else {
                console.log("Mini App запущен вне Telegram или скрипт еще загружается");
            }

            const listDiv = document.getElementById('rooms-list');
            try {
                // Запрашиваем список комнат по абсолютному адресу
                const response = await fetch('https://aningroupbot-v1-2.onrender.com/api/get_rooms');
                if (!response.ok) throw new Error("Ошибка получения списка");
                
                const rooms = await response.json();
                listDiv.innerHTML = ''; // Очищаем экран от надписи синхронизации

                if (!rooms || rooms.length === 0) {
                    listDiv.innerHTML = '<div class="empty-state">Активных чатов пока нет.<br>Создайте первый через команды бота!</div>';
                    return;
                }

                // Перебираем комнаты и выводим их карточки
                rooms.forEach(room => {
                    const card = document.createElement('div');
                    card.className = 'room-card';
                    card.innerHTML = `
                        <div class="badge">👥 ${room.members_count}</div>
                        <p class="room-title">${room.has_password ? '🔒' : '🔓'} ${room.name}</p>
                        <div class="room-meta">ID: ${room.id}</div>
                        <button class="btn" onclick="joinRoom('${room.name}')">Войти через бота</button>
                    `;
                    listDiv.appendChild(card);
                });

            } catch (error) {
                listDiv.innerHTML = `<div class="empty-state" style="color:var(--tg-theme-destructive-text-color, #ff3b30);">❌ Ошибка соединения с ботом.</div>`;
                console.error(error);
            }
        }

        // Функция входа в комнату
        async function joinRoom(roomName) {
            // Если tg не определился, пробуем вытащить его еще раз на лету
            if (!tg && window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
            }

            const user = tg?.initDataUnsafe?.user;
            if (!user || !user.id) {
                alert("Ошибка авторизации Telegram. Попробуйте войти через текстовую команду.");
                return;
            }

            try {
                const response = await fetch('https://aningroupbot-v1-2.onrender.com/api/join_room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, room_name: roomName })
                });
                const result = await response.json();
                
                if (result.success) {
                    tg?.close(); // Закрываем Mini App
                } else {
                    alert(result.error);
                }
            } catch (e) {
                alert("Ошибка отправки запроса.");
            }
        }

        // Запускаем всё строго после того, как браузер полностью скачал и собрал страницу
        window.onload = renderApp;
    </script>
</body>
</html>
