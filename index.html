<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление комнатами</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f6);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 16px;
            -webkit-user-select: none; user-select: none;
        }
        h2 { font-size: 22px; margin-bottom: 20px; text-align: center; }
        .rooms-container { display: flex; flex-direction: column; gap: 12px; }
        .room-card {
            background-color: var(--sec-bg);
            border-radius: 12px; padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            display: flex; flex-direction: column; position: relative;
        }
        .room-title { font-weight: bold; font-size: 18px; margin: 0 0 4px 0; max-width: 80%; }
        .room-meta { font-size: 13px; color: var(--hint-color); }
        .badge {
            position: absolute; top: 16px; right: 16px;
            background-color: var(--link-color); color: var(--button-text);
            padding: 4px 8px; border-radius: 20px; font-size: 12px; font-weight: bold;
        }
        .btn {
            background-color: var(--button-color); color: var(--button-text);
            border: none; border-radius: 8px; padding: 10px; margin-top: 14px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .empty-state { text-align: center; color: var(--hint-color); margin-top: 40px; }
    </style>
</head>
<body>
    <h2>🎭 Доступные комнаты</h2>
    <div id="rooms-list" class="rooms-container">
        <div class="empty-state">Загрузка комнат...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function fetchRooms() {
            const listDiv = document.getElementById('rooms-list');
            try {
                const response = await fetch('https://aningroupbot-v1-2.onrender.com/api/get_rooms');
                if (!response.ok) {
                    throw new Error(`Статус сервера: ${response.status}`);
                }
                const data = await response.json();
                
                listDiv.innerHTML = ''; 
                
                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<div class="empty-state">🎭 Активных комнат пока нет.<br>Создайте первую через команды бота!</div>';
                    return;
                }
        
                data.forEach(room => {
                    const card = document.createElement('div');
                    card.className = 'room-card';
                    card.innerHTML = `
                        <div class="badge">👥 ${room.members_count}</div>
                        <p class="room-title">${room.has_password ? '🔒' : '🔓'} ${room.name}</p>
                        <div class="room-meta">ID: ${room.id}</div>
                        <button class="btn" onclick="sendJoin('${room.name}')">Войти в комнату</button>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (error) {
                // Выводим точную ошибку прямо на экран телефона для отладки
                listDiv.innerHTML = `<div class="empty-state" style="color:#ff3b30;">❌ Ошибка загрузки:<br>${error.message}</div>`;
            }
        }


        async function sendJoin(roomName) {
            // Безопасно вытаскиваем ID юзера из контекста Telegram Telegram WebApp
            const user = tg.initDataUnsafe?.user;
            if (!user || !user.id) {
                alert("Ошибка: Не удалось определить ваш Telegram ID внутри Mini App.");
                return;
            }

            try {
                const response = await fetch('https://aningroupbot-v1-2.onrender.com/api/join_room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, room_name: roomName })
                });
                const result = await response.json();
                
                if (result.success) {
                    tg.close(); // Закрываем Mini App, юзер увидит сообщение от бота в чате
                } else {
                    alert("Ошибка: " + result.error);
                }
            } catch (e) {
                alert("Ошибка отправки запроса на сервер.");
            }
        }

        window.onload = fetchRooms;
    </script>
</body>
</html>
